[project]
name = "pytest-sources"
version = "0.2.0"
description = "pytest plugin for running tests on multiple sources"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Nguyen", email = "dan@tuppl.dev" }]
keywords = ["autograding", "grading", "plugin", "pytest", "sources", "xdist"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education :: Testing",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "execnet>=2.1",
  "pytest>=8.0,<10",
  "pytest-xdist>=3.8.0,<4",
]

[project.urls]
Homepage = "https://github.com/tuppl/pytest-sources"
Issues = "https://github.com/tuppl/pytest-sources/issues"
Repository = "https://github.com/tuppl/pytest-sources"

[project.entry-points.pytest11]
sources = "pytest_sources.plugin"

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
files = ["src/pytest_sources"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
