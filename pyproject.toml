[project]
name = "pytest-sources"
version = "0.1.0"
description = "pytest plugin for running tests on multiple sources"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dan Nguyen", email = "dan@tuppl.dev" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytest", "plugin", "xdist", "grading", "autograding", "sources"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education :: Testing",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pytest>=8.0,<10",
  "pytest-xdist>=3.8.0,<4",
]

[project.urls]
Homepage = "https://github.com/tuppl/pytest-sources"
Repository = "https://github.com/tuppl/pytest-sources"
Issues = "https://github.com/tuppl/pytest-sources/issues"

[project.entry-points.pytest11]
sources = "pytest_sources.plugin"

[dependency-groups]
dev = [
  "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
